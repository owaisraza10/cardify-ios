workflows:
  ios-release-workflow:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: "com.cardifyy.app.myWebviewApp" # Or "com.cardifyy.app.myWebviewApp" — must match Apple Portal!
        APP_STORE_APPLE_ID: 6825446619 # Your 10-digit Apple ID from App Store Connect
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Keychain & Auto-Create Apple Certificate + Profile
        script: |
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa and automatic version bump
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((LATEST_BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true