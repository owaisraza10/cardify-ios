workflows:
  ios-release-workflow:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - app_store_creds
      vars:
        BUNDLE_ID: "com.cardifyy.app.myWebviewApp"
        APP_STORE_APPLE_ID: 6825446619
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Keychain & Fetch Apple Signing Files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Prepare Xcode project & apply code signing profiles
        script: |
          flutter build ios --config-only --release --no-codesign
          xcode-project use-profiles

      - name: Flutter build ipa and automatic version bump
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 3)
          flutter build ipa --release \
            --build-name=1.2.1 \
            --build-number=$((LATEST_BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false